<!DOCTYPE html>
<html>
<head>
  <title>RewardHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #0f0f0f;
      color: white;
    }

    header {
      padding: 20px;
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      border-bottom: 1px solid #222;
    }

    .container {
      padding: 20px;
      max-width: 500px;
      margin: auto;
    }

    .upload-box {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
    }

    input {
      background: #2a2a2a;
      color: white;
    }

    button {
      background: linear-gradient(45deg, #00ff88, #00ccff);
      color: black;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      opacity: 0.8;
    }

    .post {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .post img, .post video {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .caption {
      font-size: 14px;
      opacity: 0.8;
    }

    .empty {
      text-align: center;
      opacity: 0.5;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<header>🚀 RewardHub</header>

<div class="container">

  <div class="upload-box">
    <h3>Upload Post</h3>
    <input type="file" id="fileInput">
    <input type="text" id="captionInput" placeholder="Tulis caption...">
    <button onclick="handleUpload()">Upload</button>
  </div>

  <div id="feed"></div>

</div>

<script>
  const supabaseClient = supabase.createClient(
    "https://cnchkkxgapgmmkwbqriz.supabase.co",
    "sb_publishable_-d5p8uzCzYoTRl7GBAjblA_3yHY-3nQ"
  );

  async function handleUpload() {
    const file = document.getElementById("fileInput").files[0];
    const caption = document.getElementById("captionInput").value;

    if (!file) {
      alert("Pilih file dulu!");
      return;
    }

    const fileExt = file.name.split('.').pop();
    const fileName = Date.now() + "." + fileExt;

    const { error: uploadError } = await supabaseClient
      .storage
      .from("media")
      .upload(fileName, file);

    if (uploadError) {
      alert("Upload gagal!");
      return;
    }

    const { data } = supabaseClient
      .storage
      .from("media")
      .getPublicUrl(fileName);

    const fileUrl = data.publicUrl;

    await supabaseClient
      .from("posts")
      .insert([
        {
          file_url: fileUrl,
          file_type: file.type,
          caption: caption
        }
      ]);

    document.getElementById("fileInput").value = "";
    document.getElementById("captionInput").value = "";

    loadPosts();
  }

  async function loadPosts() {
    const { data } = await supabaseClient
      .from("posts")
      .select("*")
      .order("created_at", { ascending: false });

    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    if (!data || data.length === 0) {
      feed.innerHTML = `<div class="empty">No posts yet. Be the first 🚀</div>`;
      return;
    }

    data.forEach(post => {
      const div = document.createElement("div");
      div.className = "post";

      if (post.file_type.startsWith("image")) {
        div.innerHTML += `<img src="${post.file_url}">`;
      } else {
        div.innerHTML += `<video src="${post.file_url}" controls></video>`;
      }

      div.innerHTML += `<div class="caption">${post.caption || ""}</div>`;

      feed.appendChild(div);
    });
  }

  loadPosts();
</script>

</body>
</html>
